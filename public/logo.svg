<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 375" width="100%" height="100%">
  <!-- Icon / Badge -->
  <g transform="translate(115, 187.5)">
    <!-- Outer Navy Disc -->
    <circle cx="0" cy="0" r="95" fill="#0F294A" />
    
    <!-- Gold Ring -->
    <circle cx="0" cy="0" r="77" fill="none" stroke="#F1B338" stroke-width="6.5" />

    <!-- Monogram FF -->
    <g transform="scale(0.395) translate(-253, -251)">
      <!-- Left F (White) -->
      <path d="M 152 180 H 245 V 208 H 187 V 235 H 230 V 263 H 187 V 322 H 152 Z" fill="#FFFFFF" />
      <!-- Right F (Green) -->
      <path d="M 262 180 H 355 V 208 H 297 V 235 H 340 V 263 H 297 V 322 H 262 Z" fill="#10A868" />
    </g>
  </g>

  <!-- Typography -->
  <g id="brand-text">
    <text x="245" y="200" font-family="system-ui, -apple-system, 'Montserrat', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="94" letter-spacing="-1.5">
      <tspan fill="#0F294A">Fiscal </tspan>
      <tspan fill="#10A868">Fork</tspan>
    </text>

    <!-- Accent Underline Bar -->
    <rect x="247" y="238" width="58" height="8" rx="4" fill="#F1B338" />

    <!-- Subtitle -->
    <text x="247" y="300" font-family="system-ui, -apple-system, 'Montserrat', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="24.5" fill="#0F294A" letter-spacing="11.5">ACCOUNTS OUTSOURCING</text>
  </g>
</svg>
